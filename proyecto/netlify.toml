# Configuración de Netlify para la Cafetería Escolar

[build]
  # Directorio de publicación (donde están los archivos estáticos)
  publish = "."
  
  # No hay comando de build ya que es HTML/CSS/JS estático
  command = "echo 'No build needed'"

# Headers de seguridad y caché
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://formspree.io"

# Caché para assets estáticos
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Redirecciones para URLs amigables
[[redirects]]
  from = "/menu"
  to = "/menu.html"
  status = 200

[[redirects]]
  from = "/precios"
  to = "/precios.html"
  status = 200

[[redirects]]
  from = "/horarios"
  to = "/horarios.html"
  status = 200

[[redirects]]
  from = "/contacto"
  to = "/contacto.html"
  status = 200

[[redirects]]
  from = "/ayuda"
  to = "/ayuda.html"
  status = 200

[[redirects]]
  from = "/proximamente"
  to = "/proximamente.html"
  status = 200

# Página 404 personalizada
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
